[build-system]
requires = ["setuptools>=60"]
build-backend = "setuptools.build_meta"

[project]
name = "stustapay"
version = "0.1.0"
license = { file = "LICENSE" }
maintainers = [{ name = "Michael Loipführer", email = "milo@sft.lol" }]
readme = "README.md"
classifiers = [
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU Affero General Public License v3 (AGPLv3)",
]
requires-python = ">=3.11"
dependencies = [
    "sftkit==0.4.2",
    "bcrypt==4.3.0",
    "passlib[bcrypt]==1.7.4",
    "PyYAML==6.0.3",
    "python-jose[cryptography]==3.5.0",
    "Jinja2==3.1.6",
    "aiohttp==3.13.2",
    "pylatexenc==2.10",
    "schwifty==2025.9.0",
    "sepaxml==2.7.0",
    "asn1crypto==1.5.1",
    "ecdsa==0.19.1",
    "dateutils==0.6.12",
    "aiosmtplib==5.0.0",
]

[project.scripts]
stustapay = "stustapay.cli.main:main"

[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "pytest-cov==7.0.0"]
dev = [
    "pre-commit==4.5.1",
    "ruff==0.14.10",
    "black==25.12.0",
    "isort==7.0.0",
    "mypy==1.19.1",
    "pylint==4.0.4",
    "types-PyYAML==6.0.12.20250915",
    "types-python-dateutil==2.9.0.20251115",
    "types-pytz==2025.2.0.20251108",
    "bump-my-version==1.2.6",
]

[project.urls]
Website = "https://stustapay.de"
Docs = "https://stustapay.de/docs"
Source = "https://github.com/stustapay/stustapay"

[tool.setuptools.packages.find]
namespaces = false
exclude = ["stustapay.tests*", "tests*"]

[tool.sftkit]
db_code_dir = "stustapay/core/schema/db_code"
db_migrations_dir = "stustapay/core/schema/db"

target_debian_distros = ["debian:bookworm", "debian:trixie"]

[tool.pylint]
extension-pkg-whitelist = ["pydantic"]

[tool.pylint.format]
max-line-length = 120

[tool.pylint.messages_control]
disable = [
    "C",
    "R",
    "fixme",
    "logging-fstring-interpolation",
    "unspecified-encoding",
    "broad-exception-raised",
    "broad-exception-caught",
]

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".git", ".idea", ".mypy_cache", ".venv*", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLE", "PLW"]
ignore = ["E722"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
pretty = true
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["stustapay"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
minversion = "6.0"
testpaths = ["stustapay.tests"]

[tool.bumpversion]
current_version = "0.1.0"
commit = false
files = [
    { filename = "pyproject.toml" },
    { filename = "stustapay/__init__.py" },
    { filename = "CHANGELOG.md", search = "Unreleased", replace = "{new_version} ({now:%Y-%m-%d})" },
    { filename = "CHANGELOG.md", search = "v{current_version}...HEAD", replace = "v{current_version}...v{new_version}" },
]
